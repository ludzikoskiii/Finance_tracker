<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
      <style>
     
        @import url('https://fonts.googleapis.com/css2?family=Boldonse&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Open+Sans:ital,wght@0,520;1,520&display=swap');
        </style>
         <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_circle" />
         <link rel="stylesheet" href="../css/login_styles.css">
        <link rel="shortcut icon" href="../../img/logo_no_bg.png">
        <script defer src="../js/app_register.js"></script>
     </head>
<body>
    <section class="login-body">
        <div class="login-header">
        <h1 class="login-title">Create an account</h1>
        <p class="login-underTitle">Already have an account? <a href="login.html">Log in</a></p>
       </div>
        <form action="" id="login-form" class="login-form">
            <p class="login-text full-width">Imie</p>
            <input type="text" id="login-name" class="input-size full-width">
            <p class="login-text full-width">Email</p>
            <input type="email" id="login-email" class="input-size full-width">
            <p class="login-text full-width">Password</p>
            <input type="password" id="login-password" class="input-size full-width">
            <p class="login-text full-width">Confirm Password</p>
            <input type="password" id="login-confirm-password" class="input-size full-width">
           
            <div class="login-btns full-width">
                <button type="submit" id="btn-register" class="login-btn">Sign up</button>
            </div>
            </form>
        </section>
    
</body>
</html>
